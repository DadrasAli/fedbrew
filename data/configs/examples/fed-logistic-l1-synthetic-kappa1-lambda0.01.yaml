# examples/fed-logistic-l1, fed-logistic-l1-synthetic-kappa1-lambda0.01.
#
# The problem: logistic loss + lam ||x||_1: convex, nonsmooth; F* certified at generation; lam = 0.01.
# The data: the planted generator on a design whose pooled Gram has condition number 1.
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-synthetic-kappa1-lambda0.01.yaml
#   fedbrew inspect-data data/generated/examples/fed-logistic-l1-synthetic-kappa1-lambda0.01/manifest.json
#
# See examples/fed-logistic-l1/README.md for the dataset and the problem.

dataset:
  name: fed_logistic_l1
  output_dir: data/generated/examples/fed-logistic-l1-synthetic-kappa1-lambda0.01
  # No draw for it to fix; recorded because every dataset records its seed.
  seed: 42
  extensions:
    - examples/fed-logistic-l1/problem.py

partition:
  strategy: analytic
  num_clients: 32

problem:
  dim: 32
  rows_per_client: 64
  sparsity: 3
  signal_scale: 2.0
  condition_number: 1.0
  loss: logistic
  penalty: l1
  penalty_strength: 0.01
  partition_block: 32
