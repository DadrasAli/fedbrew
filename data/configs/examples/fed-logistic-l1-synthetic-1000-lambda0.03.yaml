# examples/fed-logistic-l1, fed-logistic-l1-synthetic-1000-lambda0.03.
#
# The problem: logistic loss + lam ||x||_1: convex, nonsmooth; F* certified at generation; lam = 0.03.
# The data: the planted generator at 1,000 clients x 32 rows, d = 32.
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-synthetic-1000-lambda0.03.yaml
#   fedbrew inspect-data data/generated/examples/fed-logistic-l1-synthetic-1000-lambda0.03/manifest.json
#
# See examples/fed-logistic-l1/README.md for the dataset and the problem.

dataset:
  name: fed_logistic_l1
  output_dir: data/generated/examples/fed-logistic-l1-synthetic-1000-lambda0.03
  # No draw for it to fix; recorded because every dataset records its seed.
  seed: 42
  extensions:
    - examples/fed-logistic-l1/problem.py

partition:
  strategy: analytic
  num_clients: 1000

problem:
  dim: 32
  rows_per_client: 32
  sparsity: 3
  signal_scale: 2.0
  loss: logistic
  penalty: l1
  penalty_strength: 0.03
  partition_block: 16
