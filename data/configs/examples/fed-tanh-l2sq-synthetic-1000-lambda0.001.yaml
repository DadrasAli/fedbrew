# examples/fed-logistic-l1, fed-tanh-l2sq-synthetic-1000-lambda0.001.
#
# The problem: the tanh-loss SVM, 1 + tanh(-b a.x), + (lam/2) ||x||^2: nonconvex; no F*; lam = 0.001.
# The data: the planted generator at 1,000 clients x 32 rows, d = 32.
#
#   fedbrew generate --config data/configs/examples/fed-tanh-l2sq-synthetic-1000-lambda0.001.yaml
#   fedbrew inspect-data data/generated/examples/fed-tanh-l2sq-synthetic-1000-lambda0.001/manifest.json
#
# See examples/fed-logistic-l1/README.md for the dataset and the problem.

dataset:
  name: fed_logistic_l1
  output_dir: data/generated/examples/fed-tanh-l2sq-synthetic-1000-lambda0.001
  # No draw for it to fix; recorded because every dataset records its seed.
  seed: 42
  extensions:
    - examples/fed-logistic-l1/problem.py

partition:
  strategy: analytic
  num_clients: 1000

problem:
  dim: 32
  rows_per_client: 32
  sparsity: 3
  signal_scale: 2.0
  loss: tanh
  penalty: l2sq
  penalty_strength: 0.001
  partition_block: 16
