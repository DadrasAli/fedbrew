# examples/fed-logistic-l1, fed-logistic-nonconvex-synthetic-kappa10-lambda0.01.
#
# The problem: logistic loss + lam sum x_j^2 / (1 + x_j^2): nonconvex; no F*; lam = 0.01.
# The data: the planted generator on a design whose pooled Gram has condition number 10.
#
#   fedbrew generate --config data/configs/examples/fed-logistic-nonconvex-synthetic-kappa10-lambda0.01.yaml
#   fedbrew inspect-data data/generated/examples/fed-logistic-nonconvex-synthetic-kappa10-lambda0.01/manifest.json
#
# See examples/fed-logistic-l1/README.md for the dataset and the problem.

dataset:
  name: fed_logistic_l1
  output_dir: data/generated/examples/fed-logistic-nonconvex-synthetic-kappa10-lambda0.01
  # No draw for it to fix; recorded because every dataset records its seed.
  seed: 42
  extensions:
    - examples/fed-logistic-l1/problem.py

partition:
  strategy: analytic
  num_clients: 32

problem:
  dim: 32
  rows_per_client: 64
  sparsity: 3
  signal_scale: 2.0
  condition_number: 10.0
  loss: logistic
  penalty: nonconvex
  penalty_strength: 0.01
  partition_block: 32
