dataset:
  name: oasst1_sft
  output_dir: data/generated/oasst1_qwen05b_base_20clients
  seed: 42

oasst1_sft:
  dataset_asset_manifest: data/raw/datasets/oasst1/asset_manifest.json
  dataset_preparation_config: data/configs/assets/oasst1.yaml
  tokenizer_asset_manifest: data/raw/models/qwen2_5_0_5b_base/asset_manifest.json
  tokenizer_preparation_config: configs/llm_assets/qwen2_5_0_5b_base.yaml
  sequence_length: 512
  ignore_index: -100
  local_files_only: true
  trust_remote_code: false

tree_splits:
  train_ratio: 0.8
  client_eval_ratio: 0.1
  global_test_ratio: 0.1

# No client_splits: OASST1's splits are the tree_splits above, cut at the
# conversation tree by SHA. The section used to sit here "for the common
# generator schema" with ratios nothing applied; it is refused now.

partition:
  strategy: natural_assistant_contributor_top_target_tokens
  num_clients: 20

# null means uncapped. Training data is uncapped so client sizes reflect the
# real contributor distribution; evaluation is bounded to keep the per-round
# cost flat across 200 rounds.
pilot_caps:
  maximum_qualifying_assistant_responses_per_client: null
  maximum_client_evaluation_responses_per_client: null
  maximum_global_test_responses: null
  maximum_generated_windows_per_split:
    train_per_client: null
    client_eval_per_client: 64
    global_test: 512

