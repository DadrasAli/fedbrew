# IID: every client sees the same label distribution, drawn uniformly.
# The baseline the other three are non-IID relative to.
# fedbrew generate --config data/configs/mnist_iid.yaml
# fedbrew inspect-data data/generated/mnist_iid/manifest.json

dataset:
  name: mnist
  output_dir: data/generated/mnist_iid
  raw_dir: data/raw/datasets/mnist
  seed: 42

mnist:
  flatten: true
  normalize: none
  # Use the complete MNIST dataset:
  # max_train_samples: omitted
  # max_test_samples: omitted

client_splits:
  train_ratio: 0.8
  eval_ratio: 0.2

partition:
  strategy: iid
  num_clients: 1000
