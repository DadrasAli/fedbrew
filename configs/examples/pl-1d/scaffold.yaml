# examples/pl-1d, scaffold arm -- F(x) = x^2 + 3 sin^2(x), tilted per client.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/pl-1d/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/pl-1d.yaml
#   fedbrew run --config configs/examples/pl-1d/scaffold.yaml
#
# The rates are the ones this example has always shipped; its README records
# the search band each sits inside rather than a grid it was picked from.

extends: _base.yaml

experiment:
  tags:
    - examples
    - pl-1d
    - scaffold

client:
  update_rule: scaffold
  # One row per client: a "batch" is the whole objective, and local_iterations is
  # the number of local gradient steps per round. SCAFFOLD reads no
  # update_mode; it always runs local_iterations chained steps.
  batch_size: 1
