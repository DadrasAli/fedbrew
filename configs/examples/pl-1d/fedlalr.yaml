# examples/pl-1d, fedlalr arm -- F(x) = x^2 + 3 sin^2(x), tilted per client.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/pl-1d/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/pl-1d.yaml
#   fedbrew run --config configs/examples/pl-1d/fedlalr.yaml
#
# The rates are the ones this example has always shipped; its README records
# the search band each sits inside rather than a grid it was picked from.

extends: _base.yaml

experiment:
  tags:
    - examples
    - pl-1d
    - fedlalr

server:
  strategy: fedlalr
  # The paper aggregates the sampled clients uniformly. Every client here
  # already carries the same weight, so this changes nothing and is written
  # only so the arm is not silently different from the published algorithm.
  aggregation_weighting: uniform

client:
  update_rule: fedlalr
  # alpha. Local AMSGrad normalises the step by sqrt(v_hat), so this is not
  # on the same scale as the SGD arms' learning_rate. update_mode is
  # left unset, so it runs sequential_epoch, its default; it also takes
  # full_gradient.
  learning_rate: 0.05
