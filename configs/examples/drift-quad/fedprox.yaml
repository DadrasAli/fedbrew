# examples/drift-quad, fedprox arm -- the base dials: kappa = 100, zeta = 1.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/drift-quad/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/drift-quad.yaml
#   fedbrew run --config configs/examples/drift-quad/fedprox.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_loss at the final round, re-tuned for these dials.

extends: _base.yaml

experiment:
  tags:
    - examples
    - drift-quad
    - fedprox

server:
  strategy: fedavg

client:
  update_rule: fedprox
  learning_rate: 0.002
  # FedProx shrinks the local step toward the broadcast model. It damps drift
  # rather than cancelling it: the local fixed point moves from A^-1 b_i to
  # (A + mu I)^-1 (b_i + mu x_global), which is nearer x* but not at it.
  proximal_mu: 0.01
