# examples/drift-quad, fedlalr arm -- the base dials: kappa = 100, zeta = 1.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/drift-quad/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/drift-quad.yaml
#   fedbrew run --config configs/examples/drift-quad/fedlalr.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_loss at the final round, re-tuned for these dials.

extends: _base.yaml

experiment:
  tags:
    - examples
    - drift-quad
    - fedlalr

server:
  strategy: fedlalr
  # The paper aggregates the sampled clients uniformly. Every client here
  # already carries the same weight, so this changes nothing and is written
  # only so the arm is not silently different from the published algorithm.
  aggregation_weighting: uniform

client:
  update_rule: fedlalr
  learning_rate: 0.001
