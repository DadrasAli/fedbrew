# examples/fed-logistic-l1, corpus fed-logistic-l1-synthetic-kappa10: logistic regression with a nonconvex regularizer (logistic+nonconvex) at lam = 0.01, fedavg arm.
#
# The keys every arm shares are in ../fed-logistic-l1/_base.yaml. Generate the
# data first:
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-synthetic-kappa10.yaml
#   fedbrew run --config configs/examples/fed-logistic-l1-synthetic-kappa10/logistic-nonconvex-lambda0.01.yaml
#
# client.learning_rate is 1/L, L = 0.27 the smoothness bound of the loss
# (plus the penalty's, where it has one), rounded to three figures.

extends: ../fed-logistic-l1/_base.yaml

experiment:
  tags:
    - examples
    - fed-logistic-l1-synthetic-kappa10
    - logistic-nonconvex-lambda0.01
    - fedavg
  notes: "logistic loss + lam sum x_j^2 / (1 + x_j^2) at lam=0.01 on synthetic-kappa10; lr\
  \ = 1/L, untuned."

client:
  learning_rate: 3.7
  batch_size: 64

data:
  path: data/generated/examples/fed-logistic-l1-synthetic-kappa10/manifest.json

model:
  input_dim: 32
  loss: logistic
  penalty: nonconvex
  penalty_strength: 0.01
