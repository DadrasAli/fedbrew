# examples/fed-logistic-l1, corpus fed-logistic-l1-synthetic-kappa10: ridge logistic regression (logistic+l2sq) at lam = 0.01, fedavg arm.
#
# The keys every arm shares are in ../fed-logistic-l1/_base.yaml. Generate the
# data first:
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-synthetic-kappa10.yaml
#   fedbrew run --config configs/examples/fed-logistic-l1-synthetic-kappa10/logistic-l2sq-lambda0.01.yaml
#
# client.learning_rate is 1/L, L = 0.26 the smoothness bound of the loss
# (plus the penalty's, where it has one), rounded to three figures.

extends: ../fed-logistic-l1/_base.yaml

experiment:
  tags:
    - examples
    - fed-logistic-l1-synthetic-kappa10
    - logistic-l2sq-lambda0.01
    - fedavg
  notes: "logistic loss + (lam/2) ||x||^2 at lam=0.01 on synthetic-kappa10; lr = 1/L, untuned."

client:
  learning_rate: 3.85
  batch_size: 64

data:
  path: data/generated/examples/fed-logistic-l1-synthetic-kappa10/manifest.json

model:
  input_dim: 32
  loss: logistic
  penalty: l2sq
  penalty_strength: 0.01
