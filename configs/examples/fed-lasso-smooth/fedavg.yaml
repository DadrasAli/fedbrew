# examples/fed-lasso, fedavg arm -- the smooth control: lam = 0, so x* = x_true exactly.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/fed-lasso/problem.py, loaded by ../fed-lasso/_base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/fed-lasso-smooth.yaml
#   fedbrew run --config configs/examples/fed-lasso-smooth/fedavg.yaml
#
# client.learning_rate is a point inside the band the README's control claim
# is stated over, not a tuned winner: the gap is exactly 0.0 across all of it.

extends: ../fed-lasso/_base.yaml

experiment:
  tags:
    - examples
    - fed-lasso-smooth
    - fedavg
  notes: "Federated lasso with the L1 term removed; d=16, s=3, lam=0, zeta=0.4; x* = x_true."

client:
  update_rule: fedavg
  # NOT the base arm's 0.004. This control's claim is that removing the L1
  # term removes the whole floor, and the README states it over the band
  # 0.0125 to 0.4, where the gap is exactly 0.0 at every rate. 0.004 is the
  # rate tuned against the *lam = 0.05* objective and reaches 3.3e-07 here --
  # not a floor, just 150 rounds at a fifth of the step. A control has to be
  # run where its claim was made.
  learning_rate: 0.05
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false

data:
  path: data/generated/examples/fed-lasso-smooth/manifest.json

model:
  penalty_strength: 0.0
