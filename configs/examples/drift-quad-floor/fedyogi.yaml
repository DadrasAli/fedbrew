# examples/drift-quad, fedyogi arm -- the pure heterogeneity problem: kappa = 1, zeta = 1.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/drift-quad/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/drift-quad-floor.yaml
#   fedbrew run --config configs/examples/drift-quad-floor/fedyogi.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_loss at the final round, re-tuned for these dials.

extends: _base.yaml

experiment:
  tags:
    - examples
    - drift-quad-floor
    - fedyogi

server:
  strategy: fedyogi
  server_learning_rate: 0.01
  beta1: 0.9
  beta2: 0.99
  tau: 1.0e-8

client:
  update_rule: fedavg
  learning_rate: 1.9
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
