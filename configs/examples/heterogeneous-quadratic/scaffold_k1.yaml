# examples/heterogeneous-quadratic, SCAFFOLD, K = 1 local steps.
#
#   fedbrew generate --config data/configs/examples/heterogeneous-quadratic.yaml
#   fedbrew run --config configs/examples/heterogeneous-quadratic/scaffold_k1.yaml
#
# Option II control variates, global step 1, each client's c_i kept between
# the rounds it is sampled in. Its own loop is sequential_epoch, and one pass
# of this task's training loader is one iid minibatch, so local_iterations is
# K steps. The step is frozen across K.

extends: _base.yaml

experiment:
  tags:
    - examples
    - heterogeneous-quadratic
    - scaffold

client:
  update_rule: scaffold
  # Picked on this coupled centre at sigma 20 by the tuning protocol: SCAFFOLD at K 10, b 16,
  # 300 rounds, seed 1901, the mean gap over rounds 1..300; powers of ten
  # around 1/L_local = 1/15, every pick interior. Frozen across K.
  learning_rate: 0.1

schedule:
  rounds: 2000
  local_iterations: 1
