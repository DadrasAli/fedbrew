# examples/heterogeneous-quadratic: the keys every arm of this family shares.
#
# Not a run config: each arm names it under `extends:` and states only its
# own keys. One arm resolved, as a flat file:
#
#   fedbrew config show configs/examples/heterogeneous-quadratic/fedavg_k10.yaml
#
# The arms run on the heterogeneous quadratic's coupled centre cell
# (kappa 10, zeta* 1, epsilon 0.5, omega 1, sigma 20). The other members and
# the iid, shift-only and decoupled controls are other datasets of the same
# generator: point data.path at one (data/configs/examples/heterogeneous-
# quadratic-*.yaml). The model block carries no dial, so every arm runs on
# every dataset unchanged.

experiment:
  seed: 2027
  use_run_subdir: false
  notes: "Heterogeneous quadratic, coupled centre: kappa 10, zeta* 1, epsilon 0.5, omega 1, sigma 20; N 64, d 16, b 16."
  extensions:
    - examples/heterogeneous-quadratic/problem.py

server:
  # Every client, every round: the floors in the manifest are FedAvg's at p = 1.
  participation_rate: 1.0

client:
  # 16 rows per minibatch, drawn iid with replacement from a client's 32 rows:
  # every training pass is one such batch (README, "The stochastic oracle").
  batch_size: 16
  sampling: with_replacement

data:
  path: data/generated/examples/heterogeneous-quadratic/manifest.json

model:
  # The iterate, d = 16 from the manifest; the task places it at the member's
  # start.
  name: heterogeneous_quadratic_vector

# Every key here changes the numbers a run produces, and arms compared against
# each other must agree on all of them (docs/04 section 7.5).
numerics:
  deterministic: true
  deterministic_warn_only: false
  # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's mantissa.
  # This problem is float64 and has no matmul worth the name; written because a
  # config that omits it is not comparable with one that sets it.
  matmul_precision: highest
  cudnn_benchmark: false
  precision: reference
  use_amp: false

runtime:
  device: cpu
  # 2,000 rounds of 16-dimensional steps: a round is a millisecond or so, and a
  # CSV write per round would cost more than the round.
  flush_every: 100
  checkpointing:
    # Nothing is resumed or selected: a run is 2,000 cheap rounds, and no val_
    # metric exists to select on.
    enabled: false
    save_best: false
  performance:
    # Every client's update in one stacked step: at K = 100 the per-client loop
    # is the whole cost.
    executor: batched
    torch_num_threads: 1
    reuse_model: false
    fast_batching: false

evaluation:
  # Nothing is held out: every split is a client's 32 rows. The central pass
  # measures the global model's F(x) - F*, and the gradient pass ||grad F||^2
  # (the lasso's minimum-norm subgradient), both every 10 rounds, pinned at
  # round 1 and the last.
  train:
    every: never
  val:
    every: never
  test:
    every: never
  fit:
    every: never
  central_test:
    every: 10
  grad_norm:
    every: 10

reporting:
  fit_metrics: []
  per_client_csv: false

divergence:
  # With the fit pass off, the monitor watches the gap, which the central pass
  # measures on its schedule. A gap a million times the start's is a run that
  # has left: it stops, and is recorded as diverged.
  metric: central_test_optimality_gap
  non_finite: true
  blowup_factor: 1.0e+6
  blowup_absolute: null
  patience: null
  min_delta: 0.0

schedule:
  rounds: 2000
  local_iterations: 10
