# examples/simplex-lsq, scaffold arm -- the feasible control: the optimum inside the simplex.
#
# The problem, its closed-form constrained optimum and the generator that
# writes its data are examples/simplex-lsq/problem.py, loaded by _base.yaml. Generate
# the data first:
#
#   fedbrew generate --config data/configs/examples/simplex-lsq-feasible.yaml
#   fedbrew run --config configs/examples/simplex-lsq-feasible/scaffold.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_feasible_gap -- the projected gap, not the raw one,
# because the raw one is minimised by being *more* infeasible and a tuner
# scored on it would select for the defect.

extends: _base.yaml

experiment:
  tags:
    - examples
    - simplex-lsq-feasible
    - scaffold

server:
  strategy: scaffold

client:
  update_rule: scaffold
  learning_rate: 0.0125
  # update_mode is left unset, so SCAFFOLD runs its own loop's default,
  # sequential_epoch: local_iterations chained passes over the loader. It also
  # takes full_gradient.
  batch_size: 4
