# examples/fed-lasso, fedavg_decay arm -- the smooth control: penalty = l2.
#
# The same problem as configs/examples/fed-lasso/ with one dial turned:
# problem.penalty is l2, so lam multiplies ||x||^2/2m instead of ||x||_1 and
# the objective is differentiable everywhere. Same planted signal, same lam,
# same design, same offsets, same grid, same horizon. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/fed-lasso-l2.yaml
#   fedbrew run --config configs/examples/fed-lasso-l2/fedavg_decay.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_optimality_gap at the final round.

extends: _base.yaml

experiment:
  tags:
    - examples
    - fed-lasso-l2
    - fedavg_decay

client:
  update_rule: fedavg
  learning_rate: 0.0125
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  # `cosine` anneals from learning_rate to min_learning_rate over
  # schedule.rounds. On the L1 arm it is the textbook fix for a
  # subgradient method's O(eta*lam) floor and the one shipped thing that
  # helps. There is no such floor here, so it has much less to remove --
  # which is the control's point, and the README states the two gaps side
  # by side.
  learning_rate_schedule: cosine
  # Zero at the horizon, kept identical to the L1 arm so the comparison is
  # of the objective and not of the schedule. This pair used to raise on
  # the final round;
  # `_round_learning_rate` now clamps to the smallest positive float, so the
  # last round is the no-op the schedule asked for. FINDINGS.csv POST-F01.
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
