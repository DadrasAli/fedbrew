# examples/fed-lasso-l2: the keys every arm of this family shares.
#
# Not a run config: each arm file here names it under `extends:` and states
# only its own keys. An arm resolved, as one flat file (docs/04 section 2.2):
#
#   fedbrew config show configs/examples/fed-lasso-l2/fedavg.yaml

experiment:
  seed: 42
  use_run_subdir: false
  notes: "Federated ridge, the smooth control; d=16, s=3, lam=0.05 on ||x||^2/2m, zeta=0.4; x* = m*x_true/(m+lam)."
  # The task, the model and the generator are defined outside the package.
  # Loaded before any name below is looked up; run.json records the file's
  # SHA-256 beside the commit.
  extensions:
    - examples/fed-lasso/problem.py

server:
  # Every client, every round, as on the L1 arm. What differs is why it
  # matters: drift-quad's cancellation identity needs the local map to be
  # affine, and sign(x) is not -- but lam*x/m is, so here the local map IS
  # affine and the identity does hold. At participation 1.0 there is no
  # sampling for it to cancel; a rate below 1.0 is where that would show, and
  # changing it would stop this being a control for the L1 arm.
  participation_rate: 1.0
  # Empty, deliberately: filter_metrics keeps everything when the list is
  # empty, and a non-empty list would drop the fit_ columns of the six
  # metrics beyond `loss` that it does not name. Their central_test_ columns,
  # which run.py reads, are never filtered: the central pass does not go
  # through this list.
  metrics: []

client:
  # m = 16 rows per client, so at batch_size 4 there are four batches per
  # epoch and local training carries real minibatch noise -- the first of
  # these examples where batch_size reaches anything. The batch Hessian is a
  # rank-4 projector scaled by m/batch_size = 4, so the stability bound is
  # 2/4 = 0.5, not the full-batch 2/1.
  batch_size: 4
  metrics: []

data:
  path: data/generated/examples/fed-lasso-l2/manifest.json

model:
  name: lasso_vector
  # input_dim is a named ModelConfig field; penalty_strength, penalty,
  # support_tolerance and x_init travel as model.extra, forwarded verbatim and
  # then checked by reject_unknown_model_keys. FedLassoTask cross-checks d, lam
  # and the penalty form against the manifest's `reference`, so a model block
  # describing a different problem than the data is refused rather than run.
  input_dim: 16
  # lam, the same number as the L1 arm and NOT the same scale: the L2 term
  # carries the residual's 1/m and the L1 term does not. Part of the objective
  # the client descends, which is why it is on the model as well as in the
  # data.
  penalty_strength: 0.05
  # The dial, and the only line in this file the L1 arm does not have.
  penalty: l2
  # Kept at the L1 arm's value so the two tables are read at the same
  # threshold, and reported by the README with the warning that under ridge it
  # measures nothing: x* is theta_bar scaled, so no coordinate is selected out
  # and the support columns say what the pooled OLS solution already said.
  support_tolerance: 1.0e-3
  # The same start as the L1 arm: d exact zeros, none of which survives a
  # single gradient step. No arm here produces a zero either, and for a
  # stronger reason: on the L1 problem a proximal step would and none is
  # shipped, while under ridge no method would, because x* is theta_bar
  # scaled and nothing in the objective sets a coordinate to zero.
  x_init: 0.0

# Every key here changes the numbers a run produces, and arms compared
# against each other must agree on all of them (docs/04 section 7.5).
numerics:
  deterministic: true
  deterministic_warn_only: false
  # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's 24
  # mantissa bits. This model's matmul is 16x16, so it is irrelevant here;
  # written out because a config that omits it is not comparable with one
  # that sets it.
  matmul_precision: highest
  # Also numerics-changing, and also irrelevant here: this arm runs on the
  # CPU and touches no cuDNN kernel. Written because "irrelevant" and
  # "unstated" are different claims, and only the first is the intended one.
  cudnn_benchmark: false
  precision: reference
  use_amp: false

runtime:
  device: cpu
  checkpointing:
    enabled: true
    interval: 100000
    save_last: true
    # No val_ metric is produced, and best-checkpoint selection may only read
    # one.
    save_best: false
    save_every_round: false
    keep_last: 0
  performance:
    # One thread. These problems are 16-dimensional and torch keeps an
    # intra-op region on one thread below a grain size of 32768 elements, so
    # no reduction here is threaded at any setting. The pin states the number
    # rather than inheriting the machine's; it is NOT what makes the tables
    # reproducible -- see examples/simplex-lsq/README.md for the retraction.
    torch_num_threads: 1
    reuse_model: false
    fast_batching: false

evaluation:
  # Nothing is held out: every split is the same m rows, and the manifest says
  # so (client_test_source: identical_to_train), which is why preflight notes
  # that these test numbers are training numbers. `test` is measured because
  # the per-client aggregate is the one place client spread is visible.
  train:
    every: never
  val:
    every: never
  test:
    every: 1
    clients: all
  # F(x) for the aggregated iterate, in one pass over every client's rows.
  central_test:
    every: 1

client_statistics:
  per_client_csv: true
  std: true
  variance: false
  min: true
  max: true
  worst_percent: 10

divergence:
  metric: fit_loss
  non_finite: true
  blowup_factor: 100.0
  # F(x_0) = 0.736 at these dials and F* = 0.0820, so a fit_loss four orders
  # of magnitude above the start is a run that has left the basin rather than
  # one that is merely slow.
  blowup_absolute: 10000.0
  patience: null
  min_delta: 0.0

defaults:
  global_rounds: 150
  local_iterations: 3
