# examples/fed-lasso, fedprox arm -- the smooth control: penalty = l2.
#
# The same problem as configs/examples/fed-lasso/ with one dial turned:
# problem.penalty is l2, so lam multiplies ||x||^2/2m instead of ||x||_1 and
# the objective is differentiable everywhere. Same planted signal, same lam,
# same design, same offsets, same grid, same horizon. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/fed-lasso-l2.yaml
#   fedbrew run --config configs/examples/fed-lasso-l2/fedprox.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_optimality_gap at the final round.

extends: _base.yaml

experiment:
  tags:
    - examples
    - fed-lasso-l2
    - fedprox

client:
  update_rule: fedprox
  learning_rate: 0.008
  # FedProx adds mu/2 ||w - w_global||^2, a smooth penalty toward the
  # broadcast model. On the L1 arm that is the trap this example exists to
  # name -- a row labelled fedprox reads like the right tool on a lasso and
  # is not. Here there is no proximal operator to be mistaken for, so the
  # arm is what it always was: FedAvg with a pull toward the broadcast
  # model, on a problem where the clients already agree at the optimum.
  proximal_mu: 0.01
