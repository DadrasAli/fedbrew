# examples/fed-lasso, scaffold arm -- the base dials: lam = 0.05, zeta = 0.4.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/fed-lasso/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/fed-lasso.yaml
#   fedbrew run --config configs/examples/fed-lasso/scaffold.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_optimality_gap at the final round.

extends: _base.yaml

experiment:
  tags:
    - examples
    - fed-lasso
    - scaffold

server:
  strategy: scaffold

client:
  update_rule: scaffold
  learning_rate: 0.004
  # update_mode is left unset, so SCAFFOLD runs its own loop's default,
  # sequential_epoch: local_iterations chained passes over the loader. It also
  # takes full_gradient.
  batch_size: 4
