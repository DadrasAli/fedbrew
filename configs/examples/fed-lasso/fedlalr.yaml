# examples/fed-lasso, fedlalr arm -- the base dials: lam = 0.05, zeta = 0.4.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/fed-lasso/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/fed-lasso.yaml
#   fedbrew run --config configs/examples/fed-lasso/fedlalr.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_optimality_gap at the final round.

extends: _base.yaml

experiment:
  tags:
    - examples
    - fed-lasso
    - fedlalr

server:
  # The paper aggregates the sampled clients uniformly. Every client here
  # already carries the same weight, so this changes nothing and is written
  # only so the arm is not silently different from the published algorithm.
  aggregation_weighting: uniform

client:
  update_rule: fedlalr
  # alpha. Local AMSGrad normalises the step by sqrt(v_hat), so this is not on
  # the same scale as the SGD arms' learning_rate. update_mode is
  # left unset, so it runs sequential_epoch, its default; it also takes
  # full_gradient.
  learning_rate: 0.001
