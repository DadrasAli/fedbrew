# examples/fed-lasso, fedavg_decay arm -- the base dials: lam = 0.05, zeta = 0.4.
#
# The problem, its closed-form optimum and the generator that writes its data
# are examples/fed-lasso/problem.py, loaded by _base.yaml. Generate the data first:
#
#   fedbrew generate --config data/configs/examples/fed-lasso.yaml
#   fedbrew run --config configs/examples/fed-lasso/fedavg_decay.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_optimality_gap at the final round.

extends: _base.yaml

experiment:
  tags:
    - examples
    - fed-lasso
    - fedavg_decay

server:
  strategy: fedavg

client:
  update_rule: fedavg
  learning_rate: 0.0125
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  # `cosine` anneals from learning_rate to min_learning_rate over
  # server.global_rounds. It is the textbook fix for a subgradient method's
  # O(eta*lam) floor, and it is the one shipped thing that genuinely helps
  # here -- it still produces no zeros.
  learning_rate_schedule: cosine
  # Zero at the horizon, which is the standard form and what a decaying-step
  # subgradient method wants. This pair used to raise on the final round;
  # `_round_learning_rate` now clamps to the smallest positive float, so the
  # last round is the no-op the schedule asked for. FINDINGS.csv POST-F01.
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
