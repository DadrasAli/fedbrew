# examples/simplex-lsq, fedlalr arm -- the base dials: the optimum outside the simplex.
#
# The problem, its closed-form constrained optimum and the generator that
# writes its data are examples/simplex-lsq/problem.py, loaded by _base.yaml. Generate
# the data first:
#
#   fedbrew generate --config data/configs/examples/simplex-lsq.yaml
#   fedbrew run --config configs/examples/simplex-lsq/fedlalr.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_feasible_gap -- the projected gap, not the raw one,
# because the raw one is minimised by being *more* infeasible and a tuner
# scored on it would select for the defect.

extends: _base.yaml

experiment:
  tags:
    - examples
    - simplex-lsq
    - fedlalr

server:
  strategy: fedlalr
  # The paper aggregates the sampled clients uniformly. Every client here
  # already carries the same weight, so this changes nothing and is written
  # only so the arm is not silently different from the published algorithm.
  aggregation_weighting: uniform

client:
  update_rule: fedlalr
  # alpha. Local AMSGrad normalises the step by sqrt(v_hat), so this is not on
  # the same scale as the SGD arms' learning_rate. Reads no update_mode.
  learning_rate: 0.001
