# examples/simplex-lsq, fedyogi arm -- the base dials: the optimum outside the simplex.
#
# The problem, its closed-form constrained optimum and the generator that
# writes its data are examples/simplex-lsq/problem.py, loaded below. Generate
# the data first:
#
#   fedbrew generate --config data/configs/examples/simplex-lsq.yaml
#   fedbrew run --config configs/examples/simplex-lsq/fedyogi.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_feasible_gap -- the projected gap, not the raw one,
# because the raw one is minimised by being *more* infeasible and a tuner
# scored on it would select for the defect.

experiment:
  # Set rather than left to the filename stem, which is the convention's
  # exception: the examples ship the same arm names, so the stem alone would
  # put "fedyogi" in runs_index.jsonl once per example and dial setting.
  name: simplex-lsq-fedyogi
  seed: 42
  output_dir: outputs/examples/simplex-lsq/fedyogi
  use_run_subdir: false
  tags:
    - examples
    - simplex-lsq
    - fedyogi
  notes: "Least squares over the probability simplex; d=16, infeasibility=0.5, zeta=0.4; x* is the projection of the unconstrained optimum, which is itself infeasible."
  # The task, the model and the generator are defined outside the package.
  # Loaded before any name below is looked up; run.json records the file's
  # SHA-256 beside the commit.
  extensions:
    - examples/simplex-lsq/problem.py

server:
  strategy: fedyogi
  server_learning_rate: 0.3
  beta1: 0.9
  beta2: 0.99
  tau: 1.0e-8
  # Every client, every round. Partial participation would add drift-quad's
  # sampling floor on top, and this example is not about that: the smooth part
  # is perfectly conditioned and every arm converges. What it converges to is
  # the point.
  participation_rate: 1.0
  # Empty, deliberately: filter_metrics keeps everything when the list is
  # empty, and a non-empty list would drop the seven metrics beyond `loss` on
  # their way to the round record, since none is a name a shipped config knows
  # to ask for -- including every feasibility column.
  metrics: []

client:
  update_rule: fedavg
  learning_rate: 0.025
  # m = 16 rows per client, so at batch_size 4 there are four batches per
  # epoch and local training carries real minibatch noise. The batch Hessian
  # is a rank-4 projector scaled by m/batch_size = 4, so the stability bound
  # is 2/4 = 0.5, not the full-batch 2/1.
  batch_size: 4
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
  metrics: []

data:
  path: data/generated/examples/simplex-lsq/manifest.json

model:
  name: simplex_vector
  # input_dim is a named ModelConfig field; x_init travels as model.extra,
  # forwarded verbatim and then checked by reject_unknown_model_keys.
  # SimplexLSQTask cross-checks d against the manifest's `reference`.
  input_dim: 16
  # `uniform` is the barycentre 1/d, which is on the simplex and, at a
  # power-of-two d, sums to exactly 1.0 -- so constraint_violation is exactly
  # 0 at round 0 and never again, which is the shortest statement of what is
  # missing. `zeros` starts outside.
  x_init: uniform

runtime:
  device: cpu
  use_amp: false
  deterministic: true
  deterministic_warn_only: false
  checkpointing:
    enabled: true
    interval: 100000
    save_last: true
    # No val_ metric is produced, and best-checkpoint selection may only read
    # one.
    save_best: false
    save_every_round: false
    keep_last: 0
  performance:
    # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's 24
    # mantissa bits. This model's matmul is 16x16, so it is irrelevant here;
    # written out because a config that omits it is not comparable with one
    # that sets it.
    matmul_precision: highest
    # Also numerics-changing, and also irrelevant here: this arm runs on the
    # CPU and touches no cuDNN kernel. Written because "irrelevant" and
    # "unstated" are different claims, and only the first is the intended one.
    cudnn_benchmark: false
    # One thread. These problems are 16-dimensional and torch keeps an
    # intra-op region on one thread below a grain size of 32768 elements, so
    # no reduction here is threaded at any setting. The pin states the number
    # rather than inheriting the machine's; it is NOT what makes the tables
    # reproducible -- see this example's README for the retraction.
    torch_num_threads: 1
    reuse_model: false
    fast_batching: false

evaluation:
  # Nothing is held out: every split is the same m rows, and the manifest says
  # so (client_test_source: identical_to_train), which is why preflight notes
  # that these test numbers are training numbers. `test` is measured because
  # the per-client aggregate is the one place client spread is visible.
  train:
    every: never
  val:
    every: never
  test:
    every: 1
    clients: all
  # F(x) for the aggregated iterate, in one pass over every client's rows --
  # and, beside it, the four feasibility readings that say whether F(x) is a
  # claim about anything.
  central_test:
    every: 1

client_statistics:
  per_client_csv: true
  std: true
  variance: false
  min: true
  max: true
  worst_percent: 10

divergence:
  metric: fit_loss
  non_finite: true
  blowup_factor: 100.0
  # F(x_0) = 0.479 at the defaults and F* = 0.213, so a fit_loss four orders
  # of magnitude above the start is a run that has left the basin. Nothing
  # here should trip it: the objective is strongly convex and every arm
  # converges -- to an infeasible point, which no detector watches for.
  blowup_absolute: 10000.0
  patience: null
  min_delta: 0.0

defaults:
  global_rounds: 150
  local_iterations: 3
