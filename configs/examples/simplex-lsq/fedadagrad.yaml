# examples/simplex-lsq, fedadagrad arm -- the base dials: the optimum outside the simplex.
#
# The problem, its closed-form constrained optimum and the generator that
# writes its data are examples/simplex-lsq/problem.py, loaded by _base.yaml. Generate
# the data first:
#
#   fedbrew generate --config data/configs/examples/simplex-lsq.yaml
#   fedbrew run --config configs/examples/simplex-lsq/fedadagrad.yaml
#
# client.learning_rate is the best of the grid in this example's README,
# scored on central_test_feasible_gap -- the projected gap, not the raw one,
# because the raw one is minimised by being *more* infeasible and a tuner
# scored on it would select for the defect.

extends: _base.yaml

experiment:
  tags:
    - examples
    - simplex-lsq
    - fedadagrad

server:
  strategy: fedadagrad
  server_learning_rate: 0.3
  beta1: 0.9
  tau: 1.0e-8

client:
  update_rule: fedavg
  learning_rate: 0.025
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
