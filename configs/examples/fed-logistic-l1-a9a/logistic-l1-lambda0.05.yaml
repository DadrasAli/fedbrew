# examples/fed-logistic-l1, corpus fed-logistic-l1-a9a: l1-regularized logistic regression (logistic+l1) at lam = 0.05, fedavg arm.
#
# The keys every arm shares are in ../fed-logistic-l1/_base.yaml. Generate the
# data first:
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-a9a.yaml
#   fedbrew run --config configs/examples/fed-logistic-l1-a9a/logistic-l1-lambda0.05.yaml
#
# client.learning_rate is 1/L, L = 1.57222 the smoothness bound of the loss
# (plus the penalty's, where it has one), rounded to three figures.

extends: ../fed-logistic-l1/_base.yaml

experiment:
  tags:
    - examples
    - fed-logistic-l1-a9a
    - logistic-l1-lambda0.05
    - fedavg
  notes: "logistic loss + lam ||x||_1 at lam=0.05 on a9a; lr = 1/L, untuned."

client:
  learning_rate: 0.636
  batch_size: 32

data:
  path: data/generated/examples/fed-logistic-l1-a9a/manifest.json

model:
  input_dim: 123
  loss: logistic
  penalty: l1
  penalty_strength: 0.05
