# examples/fed-logistic-l1, corpus fed-logistic-l1-synthetic: l1-regularized logistic regression (logistic+l1) at lam = 0.03, fedavg arm.
#
# The keys every arm shares are in ../fed-logistic-l1/_base.yaml. Generate the
# data first:
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-synthetic.yaml
#   fedbrew run --config configs/examples/fed-logistic-l1-synthetic/logistic-l1-lambda0.03.yaml
#
# client.learning_rate is 1/L, L = 0.301901 the smoothness bound of the loss
# (plus the penalty's, where it has one), rounded to three figures.

extends: ../fed-logistic-l1/_base.yaml

experiment:
  tags:
    - examples
    - fed-logistic-l1-synthetic
    - logistic-l1-lambda0.03
    - fedavg
  notes: "logistic loss + lam ||x||_1 at lam=0.03 on synthetic; lr = 1/L, untuned."

client:
  learning_rate: 3.31
  batch_size: 64

data:
  path: data/generated/examples/fed-logistic-l1-synthetic/manifest.json

model:
  input_dim: 32
  loss: logistic
  penalty: l1
  penalty_strength: 0.03
