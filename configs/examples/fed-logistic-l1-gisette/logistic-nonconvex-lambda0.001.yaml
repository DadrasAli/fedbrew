# examples/fed-logistic-l1, corpus fed-logistic-l1-gisette: logistic regression with a nonconvex regularizer (logistic+nonconvex) at lam = 0.001, fedavg arm.
#
# The keys every arm shares are in ../fed-logistic-l1/_base.yaml. Generate the
# data first:
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-gisette.yaml
#   fedbrew run --config configs/examples/fed-logistic-l1-gisette/logistic-nonconvex-lambda0.001.yaml
#
# client.learning_rate is 1/L, L = 0.183021 the smoothness bound of the loss
# (plus the penalty's, where it has one), rounded to three figures.

extends: ../fed-logistic-l1/_base.yaml

experiment:
  tags:
    - examples
    - fed-logistic-l1-gisette
    - logistic-nonconvex-lambda0.001
    - fedavg
  notes: "logistic loss + lam sum x_j^2 / (1 + x_j^2) at lam=0.001 on gisette; lr = 1/L, untuned."

client:
  learning_rate: 5.46
  batch_size: 60

data:
  path: data/generated/examples/fed-logistic-l1-gisette/manifest.json

model:
  input_dim: 5000
  loss: logistic
  penalty: nonconvex
  penalty_strength: 0.001
