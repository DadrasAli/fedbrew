# examples/fed-logistic-l1, corpus fed-logistic-l1-gisette: l1-regularized logistic regression (logistic+l1) at lam = 0.0005, fedavg arm.
#
# The keys every arm shares are in ../fed-logistic-l1/_base.yaml. Generate the
# data first:
#
#   fedbrew generate --config data/configs/examples/fed-logistic-l1-gisette.yaml
#   fedbrew run --config configs/examples/fed-logistic-l1-gisette/logistic-l1-lambda5e-4.yaml
#
# client.learning_rate is 1/L, L = 0.181021 the smoothness bound of the loss
# (plus the penalty's, where it has one), rounded to three figures.

extends: ../fed-logistic-l1/_base.yaml

experiment:
  tags:
    - examples
    - fed-logistic-l1-gisette
    - logistic-l1-lambda5e-4
    - fedavg
  notes: "logistic loss + lam ||x||_1 at lam=5.0e-04 on gisette; lr = 1/L, untuned."

client:
  learning_rate: 5.52
  batch_size: 60

data:
  path: data/generated/examples/fed-logistic-l1-gisette/manifest.json

model:
  input_dim: 5000
  loss: logistic
  penalty: l1
  penalty_strength: 0.0005
