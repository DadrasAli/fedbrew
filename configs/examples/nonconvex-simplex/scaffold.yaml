# examples/nonconvex-simplex, scaffold arm -- K_5 disjoint from the star K_1,25.
#
# The problem, its Motzkin-Straus value and the generator that writes its data
# are examples/nonconvex-simplex/problem.py, loaded by _base.yaml. Generate the data
# first:
#
#   fedbrew generate --config data/configs/examples/nonconvex-simplex.yaml
#   fedbrew run --config configs/examples/nonconvex-simplex/scaffold.yaml
#
# client.learning_rate is NOT a tuned winner. Every scalar this problem offers
# is optimised by diverging faster or by not moving, so there is nothing to
# tune; it is one value per family, chosen as the largest at which the run
# still finishes. This example's README says so at length.

extends: _base.yaml

experiment:
  tags:
    - examples
    - nonconvex-simplex
    - scaffold

server:
  strategy: scaffold

client:
  update_rule: scaffold
  learning_rate: 0.05
  # SCAFFOLD reads no update_mode: it always runs local_iterations chained steps.
  batch_size: 1
