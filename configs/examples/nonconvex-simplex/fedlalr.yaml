# examples/nonconvex-simplex, fedlalr arm -- K_5 disjoint from the star K_1,25.
#
# The problem, its Motzkin-Straus value and the generator that writes its data
# are examples/nonconvex-simplex/problem.py, loaded by _base.yaml. Generate the data
# first:
#
#   fedbrew generate --config data/configs/examples/nonconvex-simplex.yaml
#   fedbrew run --config configs/examples/nonconvex-simplex/fedlalr.yaml
#
# client.learning_rate is NOT a tuned winner. Every scalar this problem offers
# is optimised by diverging faster or by not moving, so there is nothing to
# tune; it is one value per family, chosen as the largest at which the run
# still finishes. This example's README says so at length.

extends: _base.yaml

experiment:
  tags:
    - examples
    - nonconvex-simplex
    - fedlalr

server:
  # The paper aggregates the sampled clients uniformly. Every client here
  # already carries the same weight, so this changes nothing and is written
  # only so the arm is not silently different from the published algorithm.
  aggregation_weighting: uniform

client:
  update_rule: fedlalr
  # alpha. Local AMSGrad normalises the step by sqrt(v_hat), so this is not on
  # the same scale as the SGD arms' learning_rate. update_mode is
  # left unset, so it runs sequential_epoch, its default; it also takes
  # full_gradient.
  learning_rate: 0.01
