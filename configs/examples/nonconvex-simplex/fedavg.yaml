# examples/nonconvex-simplex, fedavg arm -- K_5 disjoint from the star K_1,25.
#
# The problem, its Motzkin-Straus value and the generator that writes its data
# are examples/nonconvex-simplex/problem.py, loaded below. Generate the data
# first:
#
#   fedbrew generate --config data/configs/examples/nonconvex-simplex.yaml
#   fedbrew run --config configs/examples/nonconvex-simplex/fedavg.yaml
#
# client.learning_rate is NOT a tuned winner. Every scalar this problem offers
# is optimised by diverging faster or by not moving, so there is nothing to
# tune; it is one value per family, chosen as the largest at which the run
# still finishes. This example's README says so at length.

experiment:
  # Set rather than left to the filename stem, which is the convention's
  # exception: the examples ship the same arm names, so the stem alone would
  # put "fedavg" in runs_index.jsonl once per example and dial setting.
  name: nonconvex-simplex-fedavg
  seed: 42
  output_dir: outputs/examples/nonconvex-simplex/fedavg
  use_run_subdir: false
  tags:
    - examples
    - nonconvex-simplex
    - fedavg
  notes: "Motzkin-Straus over the probability simplex; clique=5, star_leaves=25, zeta=0.1; F* = -0.4, and the unconstrained problem is unbounded below."
  # The task, the model and the generator are defined outside the package.
  # Loaded before any name below is looked up; run.json records the file's
  # SHA-256 beside the commit.
  extensions:
    - examples/nonconvex-simplex/problem.py

server:
  strategy: fedavg
  # Every client, every round. Nothing here is about client sampling.
  participation_rate: 1.0
  # Empty, deliberately: filter_metrics keeps everything when the list is
  # empty, and a non-empty list would drop the seven metrics beyond `loss` on
  # their way to the round record, since none is a name a shipped config knows
  # to ask for -- including every feasibility column.
  metrics: []

client:
  update_rule: fedavg
  # One matrix per client, so a "batch" is that client's whole objective and
  # local_iterations is exactly the number of local gradient steps per round.
  # Local training carries no minibatch noise at all, so the divergence is the
  # objective's and nothing else's.
  learning_rate: 0.05
  batch_size: 1
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
  metrics: []

data:
  path: data/generated/examples/nonconvex-simplex/manifest.json

model:
  name: simplex_point
  # d is a property of the graph -- clique_size + 1 + star_leaves -- so it is
  # derived rather than chosen, and NonconvexSimplexTask cross-checks it
  # against the manifest's `reference`. A reader who edits this number rather
  # than the generator config gets the task's error, not a different graph.
  input_dim: 31
  # The barycentre 1/d, which is on the simplex. d is not a power of two, so
  # the sum is 1.0 only to rounding and the initial constraint_violation is
  # about 1e-16 rather than exactly 0 -- six orders below anything else here.
  x_init: uniform

runtime:
  device: cpu
  use_amp: false
  deterministic: true
  deterministic_warn_only: false
  checkpointing:
    enabled: true
    interval: 100000
    save_last: true
    # No val_ metric is produced, and best-checkpoint selection may only read
    # one.
    save_best: false
    save_every_round: false
    keep_last: 0
  performance:
    # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's 24
    # mantissa bits. This model's contraction is 31x31, so it is irrelevant
    # here; written out because a config that omits it is not comparable with
    # one that sets it.
    matmul_precision: highest
    # Also numerics-changing, and also irrelevant here: this arm runs on the
    # CPU and touches no cuDNN kernel. Written because "irrelevant" and
    # "unstated" are different claims, and only the first is the intended one.
    cudnn_benchmark: false
    # One thread. This problem is 31-dimensional and torch keeps an intra-op
    # region on one thread below a grain size of 32768 elements, so no
    # reduction here is threaded at any setting. The pin states the number
    # rather than inheriting the machine's; it is NOT what makes the tables
    # reproducible -- see examples/simplex-lsq/README.md for the retraction.
    torch_num_threads: 1
    reuse_model: false
    fast_batching: false

evaluation:
  # Nothing is held out: every split is the same single matrix, and the
  # manifest says so (client_test_source: identical_to_train), which is why
  # preflight notes that these test numbers are training numbers.
  train:
    every: never
  val:
    every: never
  test:
    every: 1
    clients: all
  # F(x) for the aggregated iterate, in one pass over every client's matrix --
  # and, beside it, the feasibility readings and the projected gap.
  central_test:
    every: 1

client_statistics:
  per_client_csv: true
  std: true
  variance: false
  min: true
  max: true
  worst_percent: 10

divergence:
  # Left at the shape every other example uses, and **it will not fire**. The
  # objective is negative from round 1, so blowup_factor never arms -- it
  # anchors on the first strictly positive observation of the metric -- and
  # blowup_absolute is an upper ceiling on a value heading to -inf. non_finite
  # is the only detector left and the run stays finite for all 150 rounds.
  # That is this example's second finding, and the README's "Nothing stops it"
  # reads it off the code.
  metric: fit_loss
  non_finite: true
  blowup_factor: 100.0
  blowup_absolute: 10000.0
  patience: null
  min_delta: 0.0

defaults:
  global_rounds: 150
  local_iterations: 3
