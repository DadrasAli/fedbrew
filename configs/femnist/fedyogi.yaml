extends: _base.yaml

experiment:
  tags:
    - femnist
    - natural_non_iid
    - fedyogi
    - resnet18_gn
  notes: "FedYogi (Reddi et al., arXiv:2003.00295) on naturally writer-partitioned FEMNIST."

# Server-side adaptive optimization. The client is plain local SGD; all of the
# adaptivity is in how the server applies the aggregated pseudo-gradient
#   delta_t = mean_i(x_i^K) - x_t
#   m_t     = beta1*m + (1-beta1)*delta_t
#   v_t     = v - (1-beta2)*delta_t^2*sign(v - delta_t^2)   <- FedYogi
#   x_{t+1} = x_t + server_learning_rate * m_t/(sqrt(v_t) + tau)
#
# Known deviation from the paper: delta_t here is example-weighted (inherited
# from the FedAvg aggregation path) rather than the uniform 1/|S| of Algorithm 2.
# The paper notes non-uniform weighting "can be incorporated fairly easily", and
# keeping it matches the fedavg/fedprox/scaffold baselines.
server:
  strategy: fedyogi
  participation_rate: 0.01
  # Paper's best for EMNIST CR (their closest task): eta=10^-2.5, tau=10^-4.
  # tau floors the denominator sqrt(v) + tau, so how much it matters depends
  # on the scale of delta, which the model and the data set.
  server_learning_rate: 0.003
  beta1: 0.9
  beta2: 0.99
  tau: 0.0001
  metrics:
    - fit_loss
    - fit_accuracy

# Identical to the fedavg/fedprox/scaffold baselines so the ONLY difference
# between those sweeps and this one is the server update rule.
client:
  update_rule: fedavg
  batch_size: 16
  learning_rate: 0.2
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false
  metrics:
    - fit_loss
    - fit_accuracy
    - optimizer_steps
    - client_learning_rate

runtime:
  checkpointing:
    best_metric: val_accuracy_sample_weighted_avg
  performance:
    shard_cache_bytes: 4294967296

evaluation:
  val:
    clients: all

defaults:
  global_rounds: 500
  local_iterations: 16
