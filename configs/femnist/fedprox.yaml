extends: _base.yaml

experiment:
  tags:
    - femnist
    - natural_non_iid
    - fedprox
    - resnet18_gn
  notes: "FedProx on naturally writer-partitioned FEMNIST."

# FedProx changes nothing on the server: the proximal term lives entirely in
# the client objective. Aggregation is plain FedAvg, weighted by example count
# as the paper's experiments weight it (Section 5.1); its Algorithm 2 writes a
# uniform 1/K average.
server:
  strategy: fedavg
  participation_rate: 1
  metrics:
    - fit_loss
    - fit_accuracy
    - fit_proximal_loss
    - fit_total_loss
    # Per-round upload volume, which preflight tells a reader to compare arms
    # on. This list is the second filter: a client metric it does not name is
    # dropped before round_metrics.csv, so client.metrics naming these is not
    # enough on its own -- and for this rule, naming them only here is not
    # enough either, because its client filters them too. Both lists carry them.
    - communicated_parameters
    - communicated_bytes

client:
  update_rule: fedprox
  batch_size: 16
  learning_rate: 0.01
  # mu in (mu/2) * ||w - w_round_start||^2. mu=0 reduces exactly to FedAvg,
  # so it doubles as a sanity check. Paper grid is {0.001, 0.01, 0.1, 1}.
  proximal_mu: 0.01
  # NOTE: the FedProx client always runs `local_iterations` full passes with plain
  # SGD, so update_mode / momentum / weight_decay / nesterov /
  # learning_rate_schedule are intentionally absent - it would ignore them.
  # The comparable FedAvg baseline is update_mode: sequential_epoch.

  metrics:
    - fit_loss
    - fit_accuracy
    - fit_proximal_loss
    - fit_total_loss
    # One model's worth per round, the same as FedAvg -- the proximal term is
    # local. Reported so a cost table joining arms reads a number here rather
    # than a missing column, which looks like no cost at all.
    - communicated_parameters
    - communicated_bytes

runtime:
  checkpointing:
    best_metric: val_accuracy_sample_weighted_avg
  performance:
    shard_cache_bytes: 4294967296

evaluation:
  val:
    clients: all

defaults:
  global_rounds: 500
  local_iterations: 1
