experiment:
  seed: 42
  output_dir: outputs/femnist/fedlalr
  use_run_subdir: false
  tags:
    - femnist
    - natural_non_iid
    - fedlalr
    - resnet18_gn
  notes: "FedLALR (arXiv:2309.09719) on naturally writer-partitioned FEMNIST."

# FedLALR needs its own server strategy (like SCAFFOLD, unlike FedProx): the
# server synchronizes the momentum m and second moment v_hat that the client's
# local AMSGrad starts each round from. Validation rejects either half alone
# in both directions.
#
# The adaptivity lives on the CLIENTS, which is what separates this from
# FedAdam: every client runs AMSGrad locally and so holds its own
# per-parameter rate alpha/sqrt(v_hat) for the duration of a round, then the
# server averages the three states and hands them back.
server:
  strategy: fedlalr

  # The paper averages the sampled clients uniformly, 1/m, not by example
  # count. Keeping that reproduces the published algorithm; it also means this
  # arm aggregates differently from the fedavg/fedprox/scaffold arms, which
  # are example-weighted. Note that when reading a head-to-head table.
  aggregation_weighting: uniform

  # Matches the other cross-device FEMNIST arms.
  participation_rate: 0.01

  metrics:
    - fit_loss
    - fit_accuracy

    # Synchronized optimizer state.
    - momentum_norm
    - second_moment_norm

    # Per-client rates are what separates this arm from a shared server step,
    # and the spread across clients is what shows whether they differ; a round
    # where the std is ~0 is a round where FedLALR reduced to one shared rate.
    # Read this from round 2 on: in round 1 the coordinates that have not yet
    # seen a gradient still sit at v_hat = epsilon^2, so the nominal rate
    # there is alpha/epsilon and dominates the average. Nothing diverges --
    # m is ~0 on exactly those coordinates -- but the number is meaningless.
    - effective_learning_rate_across_clients_mean
    - effective_learning_rate_across_clients_std
    - effective_learning_rate_across_clients_min
    - effective_learning_rate_across_clients_max
    - local_steps

    # Per-round upload volume, which preflight tells a reader to compare arms
    # on. This list is the second filter: a client metric it does not name is
    # dropped before round_metrics.csv, so client.metrics naming these is not
    # enough on its own -- and for this rule, naming them only here is not
    # enough either, because its client filters them too. Both lists carry them.
    - communicated_parameters
    - communicated_bytes

client:
  update_rule: fedlalr

  batch_size: 64

  # alpha: the paper sets it per task, and it moves a lot between them (2e-3 on
  # CIFAR, 5e-2 on Shakespeare), so FEMNIST needs its own value.
  learning_rate: 0.003

  # beta1: 0.9, beta2: 0.999, epsilon: 1e-8 are omitted on purpose -- they are
  # the client's defaults and live in clients/torch_fedlalr_client.py, which
  # says which of them are the paper's.
  # epsilon is a CLIENT key only: the server reads the same one to seed
  # v_hat_{-1} = epsilon^2, so there is no server twin that could drift.
  #
  # There is no epsilon in the update's denominator. v_hat is a running
  # maximum seeded from epsilon^2 and then averaged across clients, so it can
  # never fall below epsilon^2 and alpha/sqrt(v_hat) is bounded by
  # alpha/epsilon.

  # local_iterations is the number of full local passes, as in the fedprox and
  # scaffold clients, so the fedavg comparison arm is like-for-like. There is
  # no update_mode here: Algorithm 1 specifies K chained local steps and this
  # client always runs them chained.

  metrics:
    - fit_loss
    - fit_accuracy

    - client_alpha
    # Statistics over this client's own coordinates. The server builds the
    # across-clients spread above from the first, so dropping it drops the
    # spread, and config load refuses that while anything asks for the spread.
    - effective_learning_rate_coordinate_mean
    - effective_learning_rate_coordinate_min
    - effective_learning_rate_coordinate_max
    - local_steps

    # FedLALR sends x, m and v_hat every round in both directions: 3x the
    # per-round volume of a fedavg arm at the same model size. This counts all
    # three, so arms can be compared on communicated volume rather than on
    # round count alone.
    - communicated_parameters
    - communicated_bytes

data:
  path: data/generated/femnist_natural/manifest.json

model:
  name: femnist_resnet18
  input_channels: 1
  base_channels: 32
  blocks_per_stage: [2, 2, 2, 2]
  group_norm_groups: 8
  dropout: 0.1
  num_classes: 62

runtime:
  deterministic: true
  # Strict: raise on a nondeterministic kernel rather than warn once on
  # stderr. Every CUDA kernel this model uses is deterministic on this stack
  # (measured on an A100-40GB with torch 2.5.1 and CUDA 11.8, August 2026), so
  # this costs nothing and catches a future op that is not.
  deterministic_warn_only: false
  device: auto
  # Must stay false. The AMSGrad update reads raw gradients off .grad, which
  # GradScaler.step consumes instead of leaving there; validation rejects the
  # combination rather than training on scaled gradients.
  use_amp: false
  checkpointing:
    enabled: true
    interval: 100000
    save_last: true
    save_best: true
    best_metric: val_accuracy_sample_weighted_avg
    keep_last: 0
    save_every_round: false
  performance:
    # NOT throughput-only: TF32 (10 stored mantissa bits) or a bfloat16 pair
    # (~16) instead of fp32's 24, in every matmul of every pass. Keep it
    # identical across every arm of a comparison; a run at "highest" is not
    # like-for-like with these. See docs/10-reproducibility.md.
    matmul_precision: high
    cudnn_benchmark: false
    # The three below are throughput-only and do not change results.
    # See docs/10-reproducibility.md.
    reuse_model: true
    fast_batching: true
    # Full budget, as for fedavg, NOT halved as for scaffold.
    # FedLALR holds m, v and v_hat alongside the model for the duration of one
    # client's fit -- 4 x 10.7 MB where fedavg holds 1 -- but that is transient
    # and _stream_fit_results releases each client's state as the server folds
    # it in, so peak stays near one client's worth. Nothing accumulates per
    # writer the way SCAFFOLD's control variates do.
    shard_cache_bytes: 4294967296
    dataloader:
      num_workers: 0
      pin_memory: true

evaluation:
  # One block per split. `every` is in rounds and always pins both endpoints:
  # round 1 and the final round, plus every multiple in between -- every: 10
  # gives 1, 10, 20, ..., final. `clients` is all | participating |
  # sample:<N> | resample:<N>.
  train:
    every: 10
    clients: participating
  val:
    every: 5
    clients: all
  # `never`, not omitted: leaving the block out falls back to the default
  # every: 10 / clients: all, and this is a cost choice, not a missing split.
  # FEMNIST shards are client_shard_format split_v2 (train + eval + test), so
  # a per-client test split does exist and evaluating it would be 3597
  # per-client passes. central_test below reads the same examples in one
  # batched pass: global_test.pt IS the concatenation of every writer's TEST
  # slice (client_test_source: within_client_holdout_disjoint_from_eval), so
  # central_test_* is the example-weighted pool of the per-client test metric,
  # measured on data disjoint from the eval slice that val_* and best.pt
  # selection read. What one batched pass cannot produce is the per-writer
  # spread -- test_accuracy_{std,min,worst10} need the per-client pass.
  #
  # A run's shard format is recorded in run.json under
  # reproducibility.dataset, with the manifest's sha256: a number produced
  # from an older split_v1 shard set, whose global_test.pt was a copy of the
  # eval data, is distinguishable from one produced here.
  test:
    every: never
  central_test:
    every: 10

client_statistics:
  per_client_csv: false
  std: true
  variance: false
  min: true
  max: true
  worst_percent: 10

# Stop an arm that is no longer learning and record why. A stopped run exits
# SUCCESSFULLY with status "diverged"/"stalled" in run.json and
# runs_index.jsonl -- never non-zero, so a packed job cannot mistake it for a
# crash. Grep the sweep afterwards with:
#   jq -r 'select(.status!="completed")|[.status,.stopped_round,.run_id]|@tsv' \
#     outputs/runs_index.jsonl
divergence:

  # The only metric produced every round; a val_*/train_* metric would only
  # exist on its evaluation schedule and cost up to `every` rounds of latency.
  metric: fit_loss

  non_finite: true

  # Multiple of the first strictly positive fit_loss.
  blowup_factor: 10.0

  # Absolute backstop, for a run already pathological when first measured --
  # the relative check has nothing to anchor on there. FEMNIST has 62 classes,
  # so the random-guess cross-entropy is ln(62) = 4.13 and 41.3 is an order of
  # magnitude worse than random. This is NOT the 23.0 used on MNIST: that
  # number is 10x ln(10) and would sit below FEMNIST's own useful loss range.
  # The MNIST one-label caveat also does not apply here -- FEMNIST is
  # partitioned by writer, so no client holds a single class and fit_loss does
  # not collapse to 0.0 while the global model is worthless.
  blowup_absolute: 41.3

  # Off: it is the only detector that can be wrong. A run can sit flat for a
  # long time and then improve, and a false stop would look like a result, so
  # it stays off unless a setting is known to improve without long plateaus.
  patience: null
  min_delta: 0.0

defaults:
  global_rounds: 500
  local_iterations: 20
