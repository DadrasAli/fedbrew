extends: _base.yaml

experiment:
  tags:
    - femnist
    - natural_non_iid
    - centralized
    - resnet18_gn
  notes: "Centralized upper bound on the FEMNIST writer partition, pooled into one client."

server:
  # Pools every writer of data.path into one client and trains it with the same
  # local-update engine FedAvg uses. Aggregating one client is the identity, so
  # this is the centralized upper bound on exactly the FedAvg data and model.
  strategy: centralized
  # Meaningless with a single pooled client; kept so runs stay comparable.
  participation_rate: 1

client:
  update_rule: centralized
  batch_size: 16
  learning_rate: 0.01
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  # Per round, sequential_epoch and frozen_batch_gradients consume the whole
  # pooled train set, matching what one federated round consumes across all
  # writers. single_batch consumes one batch, where a federated round consumes
  # one per participating writer -- raise local_iterations to match if needed.
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false

runtime:
  checkpointing:
    best_metric: val_accuracy_sample_weighted_avg
  performance:
    # fast_batching uploads a whole split to the GPU once and slices it there.
    # The pooled FEMNIST train split is ~733k uint8 images, which widen to ~2.3 GB
    # of float32 on device; set this false if the GPU cannot hold that.
    fast_batching: true
    # shard_cache_bytes is omitted: the pooled view reads every shard once, so
    # centralized runs force the cache off regardless of what is configured.
    dataloader:
      num_workers: 0
      pin_memory: true

evaluation:
  val:
    clients: all

reporting:
  fit_metrics:
    - fit_loss
    - fit_accuracy

defaults:
  global_rounds: 100
  local_iterations: 1
