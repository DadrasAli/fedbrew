extends: _base.yaml

experiment:
  tags:
    - femnist
    - natural_non_iid
    - fedavg
    - resnet18_gn
  notes: "FedAvg baseline on naturally writer-partitioned FEMNIST."

server:
  strategy: fedavg
  participation_rate: 1

client:
  update_rule: fedavg
  batch_size: 16
  learning_rate: 0.01
  learning_rate_schedule: constant
  min_learning_rate: 0.0
  update_mode: sequential_epoch
  frozen_gradient_weighting: examples
  momentum: 0.0
  weight_decay: 0.0
  nesterov: false

runtime:
  checkpointing:
    best_metric: val_accuracy_sample_weighted_avg
  performance:
    shard_cache_bytes: 4294967296

evaluation:
  val:
    clients: all

reporting:
  fit_metrics:
    - fit_loss
    - fit_accuracy

defaults:
  global_rounds: 500
  local_iterations: 1
