experiment:
  seed: 42
  output_dir: outputs/femnist/delta_sgd
  use_run_subdir: false
  tags:
    - femnist
    - natural_non_iid
    - delta_sgd
    - resnet18_gn
  notes: "Delta-SGD (arXiv:2306.11201) on naturally writer-partitioned FEMNIST."

# Delta-SGD is a client-only algorithm: the server is plain FedAvg and the
# whole method is the local step-size rule. Nothing model-sized crosses the
# wire beyond the model itself, and nothing persists per client between
# rounds, so this arm has the same memory profile as fedavg -- unlike
# SCAFFOLD, which stores a control variate per writer.
server:
  strategy: fedavg

  # The paper averages the sampled clients uniformly, 1/|S_t|, not by example
  # count. Keeping that means this arm reproduces the published algorithm; it
  # also means the aggregation differs from the fedavg/fedprox/scaffold arms,
  # which are example-weighted. Note that when comparing.
  aggregation_weighting: uniform

  # Matches the other cross-device FEMNIST arms.
  participation_rate: 0.01

  metrics:
    - fit_loss
    - fit_accuracy

    # The step-size trace is the algorithm. A run whose mean step size never
    # leaves eta_0 is one where the auto-tuner did nothing, and that is only
    # visible if these are written every round.
    - client_step_size_mean
    - client_step_size_min
    - client_step_size_max
    - client_step_size_final
    - step_size_clamp_fraction
    - undefined_curvature_fraction
    - optimizer_steps

    # Per-round upload volume, which preflight tells a reader to compare arms
    # on. This list is the second filter: a client metric it does not name is
    # dropped before round_metrics.csv, so client.metrics naming these is not
    # enough on its own -- and for this rule, naming them only here is not
    # enough either, because its client filters them too. Both lists carry them.
    - communicated_parameters
    - communicated_bytes

client:
  update_rule: delta_sgd

  batch_size: 64

  # The only required hyperparameter. eta_0 is the step size of the first
  # local step of every round; from there the rule re-derives it from the
  # measured local smoothness. There is deliberately no client.learning_rate:
  # the loader rejects one, because it would look tunable and would not be.
  eta_0: 0.2

  # The paper's own defaults, used unchanged across all of its experiments.
  # They were omitted here on the grounds that restating them invites drift
  # from clients/torch_delta_sgd_client.py -- a real risk, but the answer to
  # it is a test rather than an absent value that only the source can supply.
  # tests/test_shipped_config_explicitness.py asserts these three equal
  # DEFAULT_THETA_0 / DEFAULT_GAMMA / DEFAULT_DELTA, so drift fails the suite.
  theta_0: 1.0
  gamma: 2.0
  delta: 0.1

  # Unbounded, i.e. the algorithm as published. The vanishing-denominator case
  # does not need a clamp: when the gradient difference is zero the rule falls
  # back to the growth term rather than dividing by zero. Set a number only to
  # diagnose a run whose step size runs away; step_size_clamp_fraction then
  # reports how often it binds.
  eta_max: null

  # single_batch | sequential_epoch | frozen_batch_gradients.
  # sequential_epoch does real chained local SGD, and it is what the fedavg
  # comparison arm runs, so the two are like-for-like.
  update_mode: sequential_epoch

  # Read only by frozen_batch_gradients: examples | uniform | sum.
  frozen_gradient_weighting: examples

  metrics:
    - fit_loss
    - fit_accuracy

    - client_eta_0
    - client_step_size_mean
    - client_step_size_min
    - client_step_size_max
    - client_step_size_final
    - step_size_clamp_fraction
    - undefined_curvature_fraction
    - optimizer_steps

    # The run's communication cost. Delta-SGD filters its fit metrics through
    # this list, so a name left out here is dropped before the FitResult is
    # built and the column is simply absent from client_update_metrics.csv --
    # silently, for the whole run.
    - communicated_parameters
    - communicated_bytes

data:
  path: data/generated/femnist_natural/manifest.json

model:
  name: femnist_resnet18
  input_channels: 1
  base_channels: 32
  blocks_per_stage: [2, 2, 2, 2]
  group_norm_groups: 8
  dropout: 0.1
  num_classes: 62

runtime:
  deterministic: true
  # Strict: raise on a nondeterministic kernel rather than warn once on
  # stderr. Every CUDA kernel this model uses is deterministic on this stack
  # (measured on an A100-40GB with torch 2.5.1 and CUDA 11.8, August 2026), so
  # this costs nothing and catches a future op that is not.
  deterministic_warn_only: false
  device: auto
  # Must stay false. The step-size rule reads the raw gradient off .grad,
  # which GradScaler.step consumes instead of leaving there; validation
  # rejects the combination rather than training on scaled gradients.
  use_amp: false
  checkpointing:
    enabled: true
    interval: 100000
    save_last: true
    save_best: true
    best_metric: val_accuracy_sample_weighted_avg
    keep_last: 0
    save_every_round: false
  performance:
    # NOT throughput-only: TF32 (10 stored mantissa bits) or a bfloat16 pair
    # (~16) instead of fp32's 24, in every matmul of every pass. Keep it
    # identical across every arm of a comparison; a run at "highest" is not
    # like-for-like with these. See docs/10-reproducibility.md.
    matmul_precision: high
    cudnn_benchmark: false
    # The three below are throughput-only and do not change results.
    # See docs/10-reproducibility.md.
    reuse_model: true
    fast_batching: true
    # Full budget, as for fedavg. Delta-SGD's only extra memory is
    # one model-sized gradient buffer held for the duration of a fit, so there
    # is no SCAFFOLD-style reason to halve this.
    shard_cache_bytes: 4294967296
    dataloader:
      num_workers: 0
      pin_memory: true

evaluation:
  # One block per split. `every` is in rounds and always pins both endpoints:
  # round 1 and the final round, plus every multiple in between -- every: 10
  # gives 1, 10, 20, ..., final. `clients` is all | participating |
  # sample:<N> | resample:<N>.
  train:
    every: 10
    clients: participating
  val:
    every: 5
    clients: all
  # `never`, not omitted: leaving the block out falls back to the default
  # every: 10 / clients: all, and this is a cost choice, not a missing split.
  # FEMNIST shards are client_shard_format split_v2 (train + eval + test), so
  # a per-client test split does exist and evaluating it would be 3597
  # per-client passes. central_test below reads the same examples in one
  # batched pass: global_test.pt IS the concatenation of every writer's TEST
  # slice (client_test_source: within_client_holdout_disjoint_from_eval), so
  # central_test_* is the example-weighted pool of the per-client test metric,
  # measured on data disjoint from the eval slice that val_* and best.pt
  # selection read. What one batched pass cannot produce is the per-writer
  # spread -- test_accuracy_{std,min,worst10} need the per-client pass.
  #
  # A run's shard format is recorded in run.json under
  # reproducibility.dataset, with the manifest's sha256: a number produced
  # from an older split_v1 shard set, whose global_test.pt was a copy of the
  # eval data, is distinguishable from one produced here.
  test:
    every: never
  central_test:
    every: 10

client_statistics:
  per_client_csv: false
  std: true
  variance: false
  min: true
  max: true
  worst_percent: 10

# Stop an arm that is no longer learning and record why. A stopped run exits
# SUCCESSFULLY with status "diverged"/"stalled" in run.json and
# runs_index.jsonl -- never non-zero, so a packed job cannot mistake it for a
# crash. Grep the sweep afterwards with:
#   jq -r 'select(.status!="completed")|[.status,.stopped_round,.run_id]|@tsv' \
#     outputs/runs_index.jsonl
divergence:

  # The only metric produced every round; a val_*/train_* metric would only
  # exist on its evaluation schedule and cost up to `every` rounds of latency.
  metric: fit_loss

  non_finite: true

  # Multiple of the first strictly positive fit_loss.
  blowup_factor: 10.0

  # Absolute backstop, for a run already pathological when first measured --
  # the relative check has nothing to anchor on there. FEMNIST has 62 classes,
  # so the random-guess cross-entropy is ln(62) = 4.13 and 41.3 is an order of
  # magnitude worse than random. This is NOT the 23.0 used on MNIST: that
  # number is 10x ln(10) and would sit below FEMNIST's own useful loss range.
  # The MNIST one-label caveat also does not apply here -- FEMNIST is
  # partitioned by writer, so no client holds a single class and fit_loss does
  # not collapse to 0.0 while the global model is worthless.
  blowup_absolute: 41.3

  # Off: it is the only detector that can be wrong. A run can sit flat for a
  # long time and then improve, and a false stop would look like a result, so
  # it stays off unless a setting is known to improve without long plateaus.
  patience: null
  min_delta: 0.0

defaults:
  global_rounds: 500
  local_iterations: 20
