extends: _base.yaml

experiment:
  tags:
    - femnist
    - natural_non_iid
    - scaffold
    - resnet18_gn
  notes: "SCAFFOLD on naturally writer-partitioned FEMNIST."

# SCAFFOLD needs its own server strategy (unlike FedProx): the server keeps a
# global control variate c and ships it to clients each round. Validation
# rejects any other pairing in either direction.
server:
  strategy: scaffold
  # NOTE: validation warns here. A client's control variate is refreshed only
  # when the client is sampled, so at pr=0.01 each variate is on average about
  # 100 rounds old when it is used. 0.01 matches the other cross-device FEMNIST
  # arms: the FedOpt family, fedlalr, delta_sgd and fedavg_ft.
  participation_rate: 0.01
  # NOTE: validation notices here too, and the omission below is deliberate.
  # aggregation_weighting is unset, so it defaults to examples: the server
  # folds the model at n_i while scaling the summed control delta by
  # 1/num_clients regardless. So x moves along the example-weighted mean of
  # the local models and c estimates their uniform mean -- and the uniform
  # one is where c = (1/N) sum(c_i) lives, the invariant the -c_i + c
  # correction rests on. Uncommenting the line below makes both halves the
  # paper's: _result_weight returns 1.0, so x becomes (1/|S|) sum(y_i), and
  # the c update is already Karimireddy et al.'s c + (|S|/N)(1/|S|) sum(dc_i).
  #
  # It stays unset because this arm is read against fedavg, fedprox and the
  # three fedopt arms, all of which are example-weighted. The FEMNIST arms are
  # not uniform in either direction: fedlalr.yaml and delta_sgd.yaml do set
  # uniform, each for its own paper. So the choice is made per arm and not by
  # a convention that would settle it, and changing it here changes what this
  # arm computes.
  # aggregation_weighting: uniform

client:
  update_rule: scaffold
  batch_size: 16
  learning_rate: 0.2
  # NOTE: like the FedProx client, this one always runs `local_iterations` full
  # passes with plain SGD, so update_mode / momentum / weight_decay /
  # nesterov / learning_rate_schedule are intentionally absent - it would
  # ignore them. The comparable FedAvg baseline is update_mode:
  # sequential_epoch.

runtime:
  checkpointing:
    best_metric: val_accuracy_sample_weighted_avg
  performance:
    # Halved vs the fedavg/fedprox configs: SCAFFOLD stores a model-sized
    # control variate per client (10.7 MB x 3597 writers = ~38 GB by the end
    # of a run), so the shard cache has to give that memory back.
    shard_cache_bytes: 2147483648

evaluation:
  val:
    clients: all

reporting:
  fit_metrics:
    - fit_loss
    - fit_accuracy
    - control_delta_norm
    - client_control_norm
    - local_steps
    - server_control_norm
    - mean_client_control_delta_norm
    # Per-round upload volume, which preflight tells a reader to compare arms
    # on. SCAFFOLD uploads the model and the control-variate delta together and
    # receives the server control variate back beside the model, so a round is
    # 2x a FedAvg arm's volume at the same model size. This counts both, so
    # arms can be compared on communicated volume rather than round count.
    - communicated_parameters
    - communicated_bytes

defaults:
  global_rounds: 500
  local_iterations: 16
