experiment:
  seed: 42
  output_dir: outputs/dev-fafed
  use_run_subdir: false
  tags:
    - dev
    - synthetic
    - fafed
    - mlp
  notes: "Three rounds of FAFED on in-process synthetic data, no manifest on disk; every setting stated."

server:
  # FAFED takes every client every round.
  participation_rate: 1.0
  # FAFED as published averages clients uniformly.
  aggregation_weighting: uniform

client:
  update_rule: fafed
  # eta, the constant step of every local step and of the server's last one.
  learning_rate: 0.01
  batch_size: 8
  # FAFED's own settings, all stated (none is defaulted): its beta (v's decay),
  # its momentum-tracking alpha and the denominator's rho.
  beta2: 0.99
  fafed_alpha: 0.1
  fafed_rho: 0.01

data:
  num_clients: 3
  samples_per_client: 20
  input_dim: 5
  num_classes: 2

model:
  name: mlp
  input_dim: 5
  hidden_dim: 16
  num_classes: 2

# Every key here changes the numbers a run produces, and arms compared
# against each other must agree on all of them (docs/04 section 7.5).
numerics:
  deterministic: true
  deterministic_warn_only: false
  # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's 24
  # mantissa bits, where "high" drops them to TF32's 10 or a bfloat16 pair's
  # ~16. torch's own default, written out rather than left implicit -- absent
  # and "highest" are the same run but not the same document. Keep it identical
  # across every arm of a comparison.
  matmul_precision: highest
  cudnn_benchmark: false
  precision: reference
  use_amp: false

runtime:
  device: cpu
  checkpointing:
    enabled: true
    save_last: false
    save_best: false
    save_every_round: true
    keep_last: null

reporting:
  fit_metrics:
    - fit_loss
    - fit_accuracy

schedule:
  rounds: 3
  local_iterations: 2
