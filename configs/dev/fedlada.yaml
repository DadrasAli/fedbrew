experiment:
  seed: 42
  output_dir: outputs/dev-fedlada
  use_run_subdir: false
  tags:
    - dev
    - synthetic
    - fedlada
    - mlp
  notes: "Three rounds of FedLADA on in-process synthetic data, no manifest on disk; every setting stated."

server:
  participation_rate: 1.0
  # FedLADA as published averages clients uniformly.
  aggregation_weighting: uniform
  # eta_g, the server step toward the clients' mean.
  server_learning_rate: 1.0

client:
  update_rule: fedlada
  # The local rate alpha_l; each step is alpha_l (alpha m / sqrt(v_hat) + (1 - alpha) g_a).
  learning_rate: 0.01
  batch_size: 8
  # FedLADA's own settings, all stated (none is defaulted): the paper's betas
  # and eps_v (arXiv:2308.00522), and its CIFAR-10 alpha.
  beta1: 0.9
  beta2: 0.99
  epsilon: 1.0e-8
  lada_alpha: 0.1

data:
  num_clients: 3
  samples_per_client: 20
  input_dim: 5
  num_classes: 2

model:
  name: mlp
  input_dim: 5
  hidden_dim: 16
  num_classes: 2

# Every key here changes the numbers a run produces, and arms compared
# against each other must agree on all of them (docs/04 section 7.5).
numerics:
  deterministic: true
  deterministic_warn_only: false
  # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's 24
  # mantissa bits, where "high" drops them to TF32's 10 or a bfloat16 pair's
  # ~16. torch's own default, written out rather than left implicit -- absent
  # and "highest" are the same run but not the same document. Keep it identical
  # across every arm of a comparison.
  matmul_precision: highest
  cudnn_benchmark: false
  precision: reference
  use_amp: false

runtime:
  device: cpu
  checkpointing:
    enabled: true
    save_last: false
    save_best: false
    save_every_round: true
    keep_last: null

reporting:
  fit_metrics:
    - fit_loss
    - fit_accuracy

schedule:
  rounds: 3
  local_iterations: 2
