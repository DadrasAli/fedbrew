experiment:
  seed: 42
  output_dir: outputs/mnist/scaffold
  use_run_subdir: false
  tags:
    - mnist
    - label_skew
    - scaffold
    - mlp
  notes: "SCAFFOLD on one-digit-per-client MNIST, the drift-correction arm of the MNIST family."

# SCAFFOLD needs its own server strategy (unlike FedProx): the server keeps a
# global control variate c and ships it to clients each round. Validation
# rejects any other pairing in either direction.
server:
  strategy: scaffold

  # 1, as the rest of the family: every client trains every round. That also
  # removes the staleness this strategy has at a lower rate -- a control
  # variate is refreshed only when its client is sampled -- so the FEMNIST
  # arm's preflight warning does not apply here.
  participation_rate: 1

  # Unset, so it defaults to examples: the server folds the model at n_i while
  # scaling the summed control delta by 1/num_clients regardless, which is the
  # mismatch preflight reports at info. It stays unset because this arm is read
  # against fedavg.yaml and centralized.yaml, which are example-weighted, and
  # because label_skew gives every client 51-76 examples, so the two weightings
  # are close here in a way they are not on a naturally partitioned dataset.
  # aggregation_weighting: uniform

  metrics:
    - fit_loss
    - fit_accuracy
    - control_delta_norm
    - client_control_norm
    - local_steps
    - server_control_norm
    - mean_client_control_delta_norm

    # Per-round upload volume, which preflight tells a reader to compare arms
    # on. This list is the second filter: a client metric it does not name is
    # dropped before round_metrics.csv, so client.metrics naming these is not
    # enough on its own -- and for this rule, naming them only here is not
    # enough either, because its client filters them too. Both lists carry them.
    - communicated_parameters
    - communicated_bytes

client:
  update_rule: scaffold

  batch_size: 16
  learning_rate: 0.01

  # NOTE: this client always runs `local_iterations` full passes with plain SGD, so
  # update_mode / momentum / weight_decay / nesterov / learning_rate_schedule
  # are intentionally absent -- it would ignore them. fedavg.yaml in this
  # directory runs update_mode: single_batch, one batch per round, so the two
  # arms do not consume the same data per round and are not like-for-like at a
  # fixed round count. The comparable FedAvg baseline is update_mode:
  # sequential_epoch.

  metrics:
    - fit_loss
    - fit_accuracy
    - control_delta_norm
    - client_control_norm
    - local_steps

    # SCAFFOLD uploads the model and the control-variate delta together and
    # receives the server control variate back beside the model, so a round is
    # 2x a FedAvg arm's volume at the same model size. This counts both, so
    # arms can be compared on communicated volume rather than round count.
    - communicated_parameters
    - communicated_bytes

data:
  path: data/generated/mnist_one_label/manifest.json
  ## data/generated/mnist_iid/manifest.json
  ## data/generated/mnist_dirichlet/manifest.json
  ## data/generated/mnist_quantity_skew/manifest.json

model:
  name: mlp
  input_dim: 784
  hidden_dim: 64
  num_classes: 10

runtime:
  deterministic: true
  # Strict: raise on a nondeterministic kernel rather than warn once on
  # stderr. Every CUDA kernel this model uses is deterministic on this stack
  # (measured on an A100-40GB with torch 2.5.1 and CUDA 11.8, August 2026), so
  # this costs nothing and catches a future op that is not.
  deterministic_warn_only: false
  device: auto
  use_amp: false
  checkpointing:
    enabled: true
    interval: 100000
    save_last: true
    # On, because the other two arms of this family have it on and the arms of
    # a family have to agree: an arm read at its best validation round is not
    # comparable with one read at its final round.
    #
    # A resume of this arm must come from latest.pt. best.pt is written without
    # client state, and SCAFFOLD's server variate is defined as the mean of the
    # clients' -- restoring one without the others is refused at load rather
    # than run as a half-restored arm. Chapter 09 §5.
    save_best: true
    best_metric: val_accuracy_sample_weighted_avg
    keep_last: 0
    save_every_round: false
  performance:
    # NOT throughput-only: "highest" keeps every fp32 matmul at fp32's 24
    # mantissa bits, where "high" drops them to TF32's 10 or a bfloat16 pair's
    # ~16. Identical to the other two MNIST arms, so a comparison between them
    # is like-for-like.
    matmul_precision: highest
    cudnn_benchmark: false

evaluation:
  # One block per split. `every` is in rounds and always pins both endpoints:
  # round 1 and the final round, plus every multiple in between -- every: 10
  # gives 1, 10, 20, ..., final. `clients` is all | participating |
  # sample:<N> | resample:<N>. Identical to fedavg.yaml: an arm evaluated on a
  # different schedule is read at different rounds.
  train:
    every: 10
    clients: all
  val:
    every: 5
    clients: all
  test:
    every: 50
    clients: all
  central_test:
    every: 50

client_statistics:
  per_client_csv: false
  std: true
  variance: false
  min: true
  max: true
  worst_percent: 10

# Stop an arm that is no longer learning and record why. A stopped run exits
# SUCCESSFULLY with status "diverged"/"stalled" in run.json and
# runs_index.jsonl -- never non-zero, so a packed job cannot mistake it for a
# crash. Grep the sweep afterwards with:
#   jq -r 'select(.status!="completed")|[.status,.stopped_round,.run_id]|@tsv' \
#     outputs/runs_index.jsonl
divergence:

  # The only metric produced every round; a val_*/train_* metric would only
  # exist on its evaluation schedule and cost up to `every` rounds of latency.
  metric: fit_loss

  non_finite: true

  # Multiple of the first strictly positive fit_loss.
  blowup_factor: 10.0

  # The backstop that matters on this dataset. Every client holds a single
  # digit, so a saturated model fits it exactly and fit_loss reads 0.0 at
  # accuracy 1.0 -- the relative check above then has no sane anchor. 23.0 is
  # 10x ln(10), ten times the random-guess cross-entropy for 10 classes, so
  # nothing that is still learning can reach it.
  blowup_absolute: 23.0

  # Off: it is the only detector that can be wrong. A run can sit flat for a
  # long time and then improve, and a false stop would look like a result, so
  # it stays off unless a setting is known to improve without long plateaus.
  patience: null
  min_delta: 0.0

defaults:
  global_rounds: 1000

  # One full local pass per round. SCAFFOLD's correction is applied per step,
  # so this is also what sets how many corrected steps a round takes: 51-76
  # examples at batch_size 16 is 4-5 steps per client.
  local_iterations: 1
